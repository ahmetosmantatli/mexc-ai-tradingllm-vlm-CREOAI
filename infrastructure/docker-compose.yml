# MEXC Hybrid AI Trading — Compose stack
# Project name must stay distinct from Creotora on the shared Hetzner VPS.
name: mexc-ai

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: mexc-ai-trading:phase1
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8080"]
    env_file:
      - ../.env
    environment:
      LIVE_TRADING_ENABLED: "false"
      BROKER_MODE: paper
      RUNTIME_DB_PATH: /app/data/runtime.sqlite3
      KILL_SWITCH_PATH: /app/data/STOP
      DATABASE_URL: postgresql+psycopg://mexc:${POSTGRES_PASSWORD:-mexc}@postgres:5432/${POSTGRES_DB:-mexc_ai}
      REDIS_URL: redis://redis:6379/0
    ports:
      # Bind to localhost only — private dashboard / VPN later (Phase 3)
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - mexc_ai_runtime:/app/data
    restart: unless-stopped
    # Resource limit placeholders — tune after measuring Creotora headroom on Hetzner
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  worker:
    image: mexc-ai-trading:phase1
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["python", "-m", "apps.worker.main"]
    env_file:
      - ../.env
    # Explicit live gates are read from ../.env; image defaults remain PAPER/OFF.
    environment:
      RUNTIME_DB_PATH: /app/data/runtime.sqlite3
      KILL_SWITCH_PATH: /app/data/STOP
      DATABASE_URL: postgresql+psycopg://mexc:${POSTGRES_PASSWORD:-mexc}@postgres:5432/${POSTGRES_DB:-mexc_ai}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - mexc_ai_runtime:/app/data
      - ../secrets:/app/secrets:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M
    mem_limit: 768m
    cpus: 1.0

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mexc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mexc}
      POSTGRES_DB: ${POSTGRES_DB:-mexc_ai}
    volumes:
      - mexc_ai_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # No host port publish by default (avoid clashes with Creotora)
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mexc} -d $${POSTGRES_DB:-mexc_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - mexc_ai_redis:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mexc_ai_runtime:
  mexc_ai_pgdata:
  mexc_ai_redis:
